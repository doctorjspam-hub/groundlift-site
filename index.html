
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GroundLift</title>
  <style>
    body {
      background: #000;
      margin: 0;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="grid">
    <iframe src="https://www.youtube.com/embed/bDePQLV7sRg?mute=1"
      title="Yolk 1" allowfullscreen></iframe>

    <iframe src="https://www.youtube.com/embed/cjlUdm-z2x0?mute=1"
      title="Yolk 2" allowfullscreen></iframe>

    <iframe src="https://www.youtube.com/embed/dwxZZSrbPTQ?mute=1"
      title="Yolk 3" allowfullscreen></iframe>

    <iframe src="https://www.youtube.com/embed/IsYQ46d9YiE?mute=1"
      title="Yolk 4" allowfullscreen></iframe>
  </main>
</body>
</html>
